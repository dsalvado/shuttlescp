[package]
name = "guiscp"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = { version = "0.3", features = ["std"] }
glib-unix = "0.22"
oo7 = "0.6"
relm4 = "0.11"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
