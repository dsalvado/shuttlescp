# Workspace: the business logic and the user interface live in separate crates, so the
# compiler keeps them apart.
#
# * `shuttlescp-core` - everything that is not GUI: sites, settings, encrypted export, the
#   password keyring, SSH/SFTP, local file listing, logging and the login / import /
#   export workflows. It must never depend on GTK, GLib or relm4, so other front ends
#   (for example native Windows or macOS GUIs) can reuse it unchanged.
# * `shuttlescp-gtk` - the Linux front end built with relm4 / GTK 4 (binary `shuttlescp`).
[workspace]
resolver = "3"
members = ["crates/shuttlescp-core", "crates/shuttlescp-gtk"]
# `cargo run` / `cargo build` at the top level build the GTK app by default.
default-members = ["crates/shuttlescp-gtk"]

[workspace.package]
version = "0.19.0"
edition = "2024"
authors = ["David Salvador"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dsalvado/shuttlescp"
homepage = "https://shuttlescp.dsalvado.ca/"

# Versions shared by both crates; each crate opts in with `name.workspace = true`.
[workspace.dependencies]
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tempfile = "3"
