[package]
# Keeps the binary name `shuttlescp`; the directory name says which front end it is.
name = "shuttlescp"
description = "ShuttleSCP for Linux: relm4 / GTK 4 front end"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
shuttlescp-core = { path = "../shuttlescp-core" }
relm4 = "0.11"
secrecy.workspace = true
tracing.workspace = true

# Linux and macOS: quit cleanly on SIGHUP/SIGINT/SIGTERM (see app.rs quit_on_signals).
[target.'cfg(unix)'.dependencies]
glib-unix = "0.22"

# macOS: the icons Finder shows, asked from the system's NSWorkspace (see mac_icons.rs).
# Only the parts used are switched on; the calls used are all safe Rust.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSWorkspace", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[dev-dependencies]
tempfile.workspace = true

# The build script records the git commit and build time shown in the status bar and the
# About dialog.
[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
