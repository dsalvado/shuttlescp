# Continuous integration: check every change on a fresh machine.
#
# GitHub runs this on each push to master and on each pull request. If formatting,
# lint or a test fails, the commit (or pull request) gets a red cross, so problems are
# caught before they reach a release.
name: CI

# When it runs ("triggers").
on:
  push:
    branches: [master]
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, to run it by hand.
  workflow_dispatch:

# The workflow only needs to read the code. Granting the least access needed limits the
# damage a compromised step could do.
permissions:
  contents: read

# A newer push to the same branch cancels a run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and test
    # The machine ("runner"): a fresh Ubuntu 24.04 virtual machine for every run.
    runs-on: ubuntu-24.04
    steps:
      # Each step is either a ready-made action ("uses") or shell commands ("run").
      - name: Check out the code
        uses: actions/checkout@v7

      # The same packages everywhere (see the script): an AppImage only bundles what
      # the build machine has.
      - name: Install GTK 4 and its add-ons
        run: sudo packaging/linux/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keeps compiled dependencies between runs, so later runs take minutes, not ten.
      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --locked: use exactly the dependency versions in Cargo.lock.
      # -D warnings: any lint warning fails the run.
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Build the AppImage on every change too, exactly as a release would, and keep it as
  # an artifact (a file attached to the run, downloadable for 14 days from the run's
  # page). A problem in the packaging then shows before a release, not after.
  appimage:
    name: AppImage
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install GTK 4 and its add-ons
        run: sudo packaging/linux/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build the AppImage
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          packaging/linux/build-appimage.sh

      # Problems earlier releases shipped with (missing GTK add-ons, a forced theme),
      # checked on the AppImage itself. See the script.
      - name: Check the AppImage
        run: packaging/linux/check-appimage.sh dist/ShuttleSCP-*-x86_64.AppImage

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShuttleSCP-AppImage
          path: dist/ShuttleSCP-*-x86_64.AppImage
          retention-days: 14
          if-no-files-found: error

  # macOS: lint and test there too (it compiles the Mac-only code: the Keychain, the
  # Finder icons), then build the .dmg exactly as a release would and keep it as an
  # artifact. macos-14 is the oldest macOS runner GitHub offers; Homebrew builds its
  # libraries for the system it runs on, so this sets the oldest macOS the app runs
  # on (see packaging/macos/build-app.sh). Apple silicon, like the runner.
  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install GTK 4 and the packaging tools
        run: packaging/macos/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # build-app.sh runs check-app.sh on the bundle: no library from outside it, and
      # the app starts from it and quits. See the scripts.
      - name: Build the disk image
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          packaging/macos/build-dmg.sh

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShuttleSCP-macOS
          path: dist/ShuttleSCP-*-macos-arm64.dmg
          retention-days: 14
          if-no-files-found: error
