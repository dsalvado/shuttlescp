# Secret scanning: look for passwords, tokens and private keys in the code and its history.
#
# gitleaks checks the commits of each push and pull request against its rules for the
# formats of well-known secrets (cloud keys, GitHub tokens, private keys, ...). A match
# fails the run, so a leaked secret is caught before it is merged. .gitleaks.toml lists
# the accepted exceptions (the throwaway test keys) and why. Besides each change, this
# also runs once a week over the whole history, in case the rules learn a new format.
name: Secrets

on:
  push:
    branches: [master]
  pull_request:
  # Mondays at 06:43 UTC (an odd minute: on the hour, GitHub's runners are busiest).
  schedule:
    - cron: "43 6 * * 1"
  # Adds a "Run workflow" button on the Actions tab, to run it by hand.
  workflow_dispatch:

# Only reads the code (and, on a pull request, the list of its commits).
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 downloads the whole history, not only the latest commit, so that
      # secrets removed in a later commit are found too.
      - name: Check out the code and its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
