# Continuous delivery: build, sign and publish a release.
#
# Runs when a version tag such as "v0.9.0" is pushed (see docs/RELEASING.md). It checks
# that the tag matches the version in Cargo.toml and that CHANGELOG.md describes it,
# runs the tests, builds the AppImage, (on a Mac) the macOS disk image and (on Windows)
# the Windows installer, writes and signs the update manifest, and publishes everything as a GitHub release whose notes
# are the changelog's section.
# Installed copies of ShuttleSCP then find the new version through the manifest.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Creating a release needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  # The macOS disk image, built on the oldest macOS runner: the app then runs on that
  # macOS or newer (see packaging/macos/build-app.sh). It is handed to the publishing
  # job below as an artifact. Nothing here is signed with a secret.
  macos:
    name: macOS disk image
    runs-on: macos-14
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install GTK 4 and the packaging tools
        run: packaging/macos/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      # build-app.sh also checks the bundle (check-app.sh).
      - name: Build the disk image
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          packaging/macos/build-dmg.sh

      - name: Hand it to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/ShuttleSCP-*-macos-arm64.dmg
          retention-days: 1
          if-no-files-found: error

  # The Windows installer, built as in CI (see ci.yml and packaging/windows) and handed
  # to the publishing job below. Nothing here is signed with a secret.
  windows:
    name: Windows installer
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit

      - name: Install GTK 4 and the packaging tools
        run: packaging/windows/install-build-deps.sh

      - name: Install Rust (the GNU toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo +stable-x86_64-pc-windows-gnu test --workspace --locked

      - name: Install Inno Setup
        shell: pwsh
        run: packaging/windows/install-inno-setup.ps1

      - name: Build the program folder
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          packaging/windows/build-bundle.sh

      - name: Check the program folder
        shell: pwsh
        env:
          GSK_RENDERER: cairo
        run: packaging/windows/check-bundle.ps1

      - name: Build the installer
        run: packaging/windows/build-installer.sh

      - name: Hand it to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: target/windows/ShuttleSCP-*-windows-x64-setup.exe
          retention-days: 1
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [macos, windows]
    # Ubuntu 24.04: the AppImage then runs on systems with glibc 2.39 or newer and
    # needs nothing installed. Building on the oldest supported system is the rule.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check the tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      # The release notes are the version's section of CHANGELOG.md: from its
      # "## [x.y.z]" heading to the next "## [" heading. Checked first, so a release
      # without notes stops before anything is built.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # The same packages everywhere (see the script): an AppImage only bundles what
      # the build machine has.
      - name: Install GTK 4 and its add-ons
        run: sudo packaging/linux/install-build-deps.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # A release is never made from code whose tests fail.
      - name: Test
        run: cargo test --workspace --locked

      # SOURCE_DATE_EPOCH: the build date shown in the app becomes the commit's date,
      # so rebuilding the same commit gives the same result (see BUILDING.md).
      - name: Build the AppImage
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          packaging/linux/build-appimage.sh

      # Problems earlier releases shipped with (missing GTK add-ons, a forced theme),
      # checked on the AppImage itself before it is signed. See the script.
      - name: Check the AppImage
        run: packaging/linux/check-appimage.sh dist/ShuttleSCP-*-x86_64.AppImage

      # Started on older systems than it was built on (it carries their missing glibc): the
      # window must appear on Ubuntu 22.04 and Debian 12, with nothing installed but a
      # virtual display. See the script.
      - name: Start it on Ubuntu 22.04 and Debian 12
        run: |
          packaging/linux/test-old-distro.sh dist/ShuttleSCP-*-x86_64.AppImage ubuntu:22.04
          packaging/linux/test-old-distro.sh dist/ShuttleSCP-*-x86_64.AppImage debian:12

      # v8 fails if the file does not match the checksum recorded when it was handed over.
      - name: Collect the macOS disk image
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dist

      - name: Collect the Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-setup
          path: dist

      # The private signing key is a repository secret: GitHub hands it to this step
      # only, and hides it in the logs. It is written to a temporary file just for the
      # signing and removed straight after.
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is not set (see docs/RELEASING.md)"
            exit 1
          fi
          public_key=$(sed -n 's/^pub const RELEASE_PUBLIC_KEY: &str = "\(.*\)";/\1/p' crates/shuttlescp-core/src/update.rs)
          if [ -z "$public_key" ]; then
            echo "::error::RELEASE_PUBLIC_KEY is empty in crates/shuttlescp-core/src/update.rs"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          PUBLIC_KEY="$public_key" packaging/make-release-manifest.sh dist/ShuttleSCP-*-x86_64.AppImage "$key" \
            dist/ShuttleSCP-*-macos-arm64.dmg dist/ShuttleSCP-*-windows-x64-setup.exe

      # gh is GitHub's command-line tool, already on the runner. The token is a
      # short-lived one GitHub makes for this run, limited by "permissions" above.
      # Versions 0.x are the public beta, and say so in the title. (They are not marked
      # "pre-release" on GitHub: that would hide them from the "latest release" link
      # the web page and the app's update check use.)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          title="ShuttleSCP $version"
          case "$version" in 0.*) title="$title (public beta)" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$title" \
            --notes-file dist/release-notes.md \
            dist/ShuttleSCP-*-x86_64.AppImage \
            dist/ShuttleSCP-*-macos-arm64.dmg \
            dist/ShuttleSCP-*-windows-x64-setup.exe \
            dist/latest.json \
            dist/latest.json.sig \
            dist/SHA256SUMS
